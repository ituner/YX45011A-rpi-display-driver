name: Materialize reference schematic
on:
  push:
    paths:
      - hardware/SCH_Schematic2_2026-04-21.pdf.gz
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gzip -dc hardware/SCH_Schematic2_2026-04-21.pdf.gz > hardware/SCH_Schematic2_2026-04-21.pdf
          rm hardware/SCH_Schematic2_2026-04-21.pdf.gz .github/workflows/materialize-schematic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add reference schematic PDF"
          git push
